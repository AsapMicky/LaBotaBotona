name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: firmware } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install platformio
      - run: pio test -e native

  app-paciente:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app-paciente } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  web-medico:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web-medico } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: web-medico/package-lock.json }
      - run: npm ci
      - run: npm run build
