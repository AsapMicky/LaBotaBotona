; Dosímetro de carga plantar — firmware
[platformio]
; El prototipo real usa un ESP32 clásico (ver docs/avances/). El entorno esp32s3 queda
; por si la placa final cambia, pero hoy no es la que está armada.
default_envs = esp32dev

[common]
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags = -std=gnu++17 -DFW_MAYOR=0 -DFW_MENOR=1 -DFW_PARCHE=0
; Ojo: el core de Arduino para ESP32 agrega su propio -std=gnu++11 después de estos flags y lo
; pisa; build_unflags no lo saca. Por eso el código de lib/ no puede depender de C++14 o 17
; aunque acá diga gnu++17: los tests en la PC compilan con 17 y la placa con 11.

; Alternativa si la placa final termina siendo un S3. No es la del prototipo.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DPLACA_S3

; ESP32 clásico (ESP-WROOM-32, DevKit de 38 pines): la placa del prototipo real
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DPLACA_DEVKIT

; Tests en la PC, sin placa
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
lib_ignore = NimBLE-Arduino
; ArduinoJson solo para leer docs/protocolo-vectores.json en test_protocolo
lib_deps = bblanchon/ArduinoJson@^7.4.3
