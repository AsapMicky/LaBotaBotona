; Dosímetro de carga plantar — firmware
[platformio]
default_envs = esp32s3

[common]
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags = -std=gnu++17 -DFW_MAYOR=0 -DFW_MENOR=1 -DFW_PARCHE=0

; Placa final (ESP32-S3-WROOM-1-N16) o devkit S3
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DPLACA_S3

; NodeMCU ESP32 (WROOM-32) para el simulador con potenciómetro
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = ${common.lib_deps}
build_flags = ${common.build_flags} -DPLACA_DEVKIT

; Tests en la PC, sin placa
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -DUNITY_INCLUDE_DOUBLE
lib_ignore = NimBLE-Arduino
; ArduinoJson solo para leer docs/protocolo-vectores.json en test_protocolo
lib_deps = bblanchon/ArduinoJson@^7.4.3
